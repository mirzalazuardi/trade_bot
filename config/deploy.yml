# Name of your application. Used to uniquely configure containers.
service: trade_bot

# Name of the container image.
image: mirzalazuardi/trade_bot

# Deploy to these servers.
servers:
  web:
    - 43.157.201.245
  # Uncomment below to run Solid Queue on a separate server:
  # job:
  #   hosts:
  #     - 43.157.201.245
  #   cmd: bin/jobs

# No domain yet — accessible via http://43.157.201.245
# When you add a domain, uncomment ssl and set host.
proxy:
  # ssl: true
  # host: trade.yourdomain.com
  app_port: 3000

# SSH user on VPS (default is root, yours is ubuntu)
ssh:
  user: ubuntu

# Where you keep your container images.
registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
  clear:
    # Run Solid Queue inside Puma process (budget VPS single-container mode)
    SOLID_QUEUE_IN_PUMA: true

    # Budget VPS: 2 workers for 2GB, 1 worker for 1GB
    WEB_CONCURRENCY: 1

    # Rails log level
    RAILS_LOG_LEVEL: info

# Aliases for common commands
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent storage for Active Storage and ML models
volumes:
  - "trade_bot_storage:/rails/storage"

# Bridge fingerprinted assets between deploys
asset_path: /rails/public/assets

# Configure the image builder
builder:
  arch: amd64
  # Uncomment for faster builds on Apple Silicon:
  # remote: ssh://docker@docker-builder-server

# PostgreSQL as accessory (or use external managed DB)
# Uncomment if you want Kamal to manage PostgreSQL on the VPS:
